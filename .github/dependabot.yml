version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    labels: [dependencies, "area:ci"]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /scripts/ci
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    labels: [dependencies, "area:ci"]
    groups:
      ci-python:
        patterns: ["*"]
