name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  WEGIT_SKIP_PROJECT_GENERATION: '1'
  WEGIT_SERIAL_CORE_TESTS: '1'
jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site_only: ${{ steps.scope.outputs.site_only }}
      site_changed: ${{ steps.scope.outputs.site_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete immutable Git range
        id: scope
        run: python3 scripts/ci/change_scope.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
  policy:
    name: Repository validation
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install checksum-pinned tools and policy dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/wegit-python"
          "$RUNNER_TEMP/wegit-python/bin/python" -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
          echo "$RUNNER_TEMP/wegit-python/bin" >> "$GITHUB_PATH"
          python3 scripts/ci/install_tools.py --destination "$RUNNER_TEMP/wegit-tools" actionlint gitleaks
      - name: Workflow lint, repository contracts and tooling tests
        run: |
          "$RUNNER_TEMP/wegit-tools/actionlint" -color
          python3 scripts/ci/check_policy.py
          python3 -m unittest discover -s scripts/ci/tests -v
          python3 scripts/ci/verify_secret_policy.py --gitleaks "$RUNNER_TEMP/wegit-tools/gitleaks"
          git diff --check
      - name: Scan committed history for credentials
        run: |
          mkdir -p .build/ci
          "$RUNNER_TEMP/wegit-tools/gitleaks" git --no-banner --redact=100 \
            --report-format=json --report-path=.build/ci/secrets.json .
      - name: Retain policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-${{ github.sha }}
          path: .build/ci/
          include-hidden-files: true
          retention-days: 14
  native:
    name: Native macOS
    needs: [changes, policy]
    if: needs.changes.outputs.site_only != 'true'
    # GitHub's xcode-27 preview image currently runs macOS 27, arm64.
    # PR code only runs on fresh GitHub-hosted VMs, never a personal Mac.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolate Git configuration without affecting checkout cleanup
        run: scripts/ci/isolate-git.sh
      - name: Verify actual OS, architecture and Xcode
        run: |
          mkdir -p .build/ci
          scripts/ci/check-toolchain.sh | tee .build/ci/toolchain.txt
      - name: Formatting, core tests and Debug build
        run: scripts/verify.sh
      - name: Minimum Git 2.46 core regression
        run: |
          scripts/ci/prepare-git-246.sh
          env WEGIT_TEST_GIT="$(cat .build/git-246-path)" swift test --no-parallel
      - name: Native feature behavior checks
        run: scripts/ci/native-behavior.sh
      - name: Apple and Homebrew Git with isolated OpenPGP signing
        run: scripts/verify-gpg-compatibility.sh
      - name: Complete core regression with actual Homebrew Git
        run: |
          env WEGIT_TEST_GIT="$(brew --prefix git)/bin/git" swift test --no-parallel | tee .build/ci/homebrew-core.log
      - name: Compile native UI regressions
        run: |
          xcodebuild -project WeGit.xcodeproj -scheme WeGit -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build-app \
            -resultBundlePath .build/ci/native-build.xcresult build-for-testing
          if [[ -f scripts/verify-ui-git-wrapper.py ]]; then
            python3 scripts/verify-ui-git-wrapper.py .build-app/Build/Products/Debug/WeGitTestGit
          fi
      - name: Ordinary Release and preview package
        run: |
          scripts/build.sh Release
          scripts/package-release.sh --preview
          git diff --exit-code
      - name: Retain native evidence and preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ github.sha }}
          path: |
            .build/ci/
            .build/*-checks-*/result.json
            .build/worktree-read-performance-*/result.json
            .build/rebase-performance-*/result.json
            .build/conflict-editor-performance-*/result.json
            .build/interactive-rebase-performance-*/result.json
            .build/submodule-lfs-performance-*/result.json
            .build/rebase-performance-*/failure-fixture.tar.gz
            .build/appearance-icons-*/result.json
            .build/native-application-menu-*/result.json
            .build/releases/package-*/*.zip
            .build/releases/package-*/*.sha256
            .build/releases/package-*/manifest.json
            .build-app/Build/Products/Release/WeGit.app/Contents/Resources/build-source.json
          include-hidden-files: true
          retention-days: 14
  site:
    name: Site checks
    needs: changes
    if: needs.changes.outputs.site_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Locked dependencies, site tests, build and original budgets
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
          npm run check:budget
          npx wrangler deploy --dry-run
      - name: Legacy website tests and immutable release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > .build/public-releases.json
          python3 -m unittest scripts.ci.tests.test_website -v
          python3 scripts/build_website.py --base-path "/${GITHUB_REPOSITORY#*/}" --releases-json .build/public-releases.json
          git diff --exit-code
      - name: Exercise the production Worker locally
        working-directory: site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/wegit-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          ready=0
          for _attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4179/healthz; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/wegit-worker.log"
            exit 1
          fi
          npm run test:worker
      - name: Retain the validated static site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: .build/website
          include-hidden-files: true
          retention-days: 14
  required:
    name: Repository policy
    needs: [changes, policy, native, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the applicable validation results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_ci_results.py
