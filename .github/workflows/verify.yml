name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_validation:
        description: Explicitly run backend validation
        type: boolean
        default: false
      site_validation:
        description: Run website validation
        type: boolean
        default: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  WEGIT_SKIP_PROJECT_GENERATION: '1'
  WEGIT_SERIAL_CORE_TESTS: '1'
jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      site_only: ${{ steps.scope.outputs.site_only }}
      site_changed: ${{ steps.scope.outputs.site_changed }}
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
      policy_changed: ${{ steps.scope.outputs.policy_changed }}
      frontend_changed: ${{ steps.scope.outputs.frontend_changed }}
      core_tests_changed: ${{ steps.scope.outputs.core_tests_changed }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      validation_requested: ${{ steps.scope.outputs.validation_requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete immutable Git range
        id: scope
        run: python3 scripts/ci/change_scope.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
  policy:
    name: Repository validation
    needs: changes
    if: needs.changes.outputs.policy_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install checksum-pinned tools and policy dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/wegit-python"
          "$RUNNER_TEMP/wegit-python/bin/python" -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
          echo "$RUNNER_TEMP/wegit-python/bin" >> "$GITHUB_PATH"
          python3 scripts/ci/install_tools.py --destination "$RUNNER_TEMP/wegit-tools" actionlint gitleaks
      - name: Workflow lint, repository contracts and tooling tests
        run: |
          "$RUNNER_TEMP/wegit-tools/actionlint" -color
          python3 scripts/ci/check_policy.py
          python3 -m unittest discover -s scripts/ci/tests -v
          python3 scripts/ci/verify_secret_policy.py --gitleaks "$RUNNER_TEMP/wegit-tools/gitleaks"
          git diff --check
      - name: Scan committed history for credentials
        run: |
          mkdir -p .build/ci
          "$RUNNER_TEMP/wegit-tools/gitleaks" git --no-banner --redact=100 \
            --report-format=json --report-path=.build/ci/secrets.json .
      - name: Retain policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-${{ github.sha }}
          path: .build/ci/
          include-hidden-files: true
          retention-days: 14
  native:
    name: Native macOS
    needs: [changes, policy]
    if: needs.changes.outputs.backend_changed == 'true' && needs.changes.outputs.validation_requested == 'true'
    # GitHub's xcode-27 preview image currently runs macOS 27, arm64.
    # PR code only runs on fresh GitHub-hosted VMs, never a personal Mac.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate Git configuration without affecting checkout cleanup
        run: scripts/ci/isolate-git.sh
      - name: Verify actual OS, architecture and Xcode
        run: |
          mkdir -p .build/ci
          scripts/ci/check-toolchain.sh | tee .build/ci/toolchain.txt
      - name: Identify the exact build toolchain
        id: build_inputs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, 'scripts/ci')
          from batch_evidence import digest, toolchain
          print('toolchain=' + digest(toolchain()))
          PY
      - name: Restore incremental builds, never validation results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/arm64-apple-macosx
            .build/workspace-state.json
            .build-app/Build
            .build-app/ModuleCache.noindex
            .build-app/SourcePackages
          key: native-build-v1-${{ steps.build_inputs.outputs.toolchain }}-${{ hashFiles('Package.swift', 'project.yml', 'WeGitCore/**', 'WeGit/**', 'WeGitAskPass/**', 'WeGitTests/**', 'WeGitUITests/**', 'WeGit.xcodeproj/**') }}
          restore-keys: native-build-v1-${{ steps.build_inputs.outputs.toolchain }}-
      - name: Verify canonical evidence against immutable input bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/batch_evidence.py restore --repo "$GITHUB_REPOSITORY"
      - name: Core regression on Apple, minimum and Homebrew Git
        run: python3 scripts/ci/batch_evidence.py run --suite core
      - name: Isolated Apple and Homebrew OpenPGP signing
        run: python3 scripts/ci/batch_evidence.py run --suite signing
      - name: Native feature behavior
        run: python3 scripts/ci/batch_evidence.py run --suite behavior
      - name: Backend performance budgets
        run: python3 scripts/ci/batch_evidence.py run --suite performance
      - name: Compile application and native UI regressions
        run: python3 scripts/ci/batch_evidence.py run --suite application
      - name: Build and verify the actual Release preview
        run: python3 scripts/ci/batch_evidence.py run --suite package
      - name: Retain independently reusable suite receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: batch-receipts-${{ github.sha }}
          path: |
            .build/ci/receipts/core.json
            .build/ci/receipts/signing.json
            .build/ci/receipts/behavior.json
            .build/ci/receipts/performance.json
            .build/ci/receipts/application.json
            .build/ci/receipts/package.json
          retention-days: 30
      - name: Retain native evidence and preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ github.sha }}
          path: |
            .build/ci/
            .build/*-checks-*/result.json
            .build/worktree-read-performance-*/result.json
            .build/rebase-performance-*/result.json
            .build/recovery-performance-*/result.json
            .build/conflict-editor-performance-*/result.json
            .build/interactive-rebase-performance-*/result.json
            .build/submodule-lfs-performance-*/result.json
            .build/rebase-performance-*/failure-fixture.tar.gz
            .build/appearance-icons-*/result.json
            .build/native-application-menu-*/result.json
            .build/releases/package-*/*.dmg
            .build/releases/package-*/*.sha256
            .build/releases/package-*/manifest.json
            .build-app/Build/Products/Release/WeGit.app/Contents/Resources/build-source.json
          include-hidden-files: true
          retention-days: 14
  site:
    name: Site checks
    needs: changes
    if: needs.changes.outputs.site_changed == 'true' && needs.changes.outputs.validation_requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Locked dependencies, site tests, build and original budgets
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
          npm run check:budget
          npx wrangler deploy --dry-run
      - name: Legacy website tests and immutable release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > .build/public-releases.json
          python3 -m unittest scripts.ci.tests.test_website -v
          python3 scripts/build_website.py --base-path "/${GITHUB_REPOSITORY#*/}" --releases-json .build/public-releases.json
          git diff --exit-code
      - name: Exercise the production Worker locally
        working-directory: site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/wegit-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          ready=0
          for _attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4179/healthz; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/wegit-worker.log"
            exit 1
          fi
          npm run test:worker
      - name: Retain the validated static site
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: .build/website
          include-hidden-files: true
          retention-days: 14
  required:
    name: Repository policy
    needs: [changes, policy, native, site, frontend, test_compile, docs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the applicable validation results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_ci_results.py
  frontend:
    name: Native frontend build
    needs: changes
    if: needs.changes.outputs.frontend_changed == 'true' && needs.changes.outputs.validation_requested == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile native views and UI test sources without executing tests
        run: |
          xcodebuild -project WeGit.xcodeproj -scheme WeGit -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build-app build-for-testing
  test_compile:
    name: Core test compilation
    needs: changes
    if: needs.changes.outputs.core_tests_changed == 'true' && needs.changes.outputs.validation_requested == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile changed test or benchmark sources without running backend suites
        run: swift build --build-tests
  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed documentation links
        run: python3 scripts/ci/check_docs.py --event "$GITHUB_EVENT_PATH"
