name: Cloudflare website
on:
  pull_request:
    paths: ['site/**', 'design/brand/**', '.github/workflows/workers.yml']
  push:
    branches: [main]
    paths: ['site/**', 'design/brand/**', '.github/workflows/workers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Cloudflare build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies and verify
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
          npm run check:budget
          npx wrangler deploy --dry-run
      - name: Exercise the production Worker locally
        working-directory: site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4179 > /tmp/wegit-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          ready=0
          for _attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4179/healthz; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != 1 ]]; then
            cat /tmp/wegit-worker.log
            exit 1
          fi
          npm run test:worker
