name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
        type: string
      acceptance_run:
        description: Successful Full acceptance run ID for stable tags; same source SHA
        required: false
        default: ''
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: draft-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      ci_run: ${{ steps.resolve.outputs.ci_run }}
      acceptance_run: ${{ steps.resolve.outputs.acceptance_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve tag and exact-source validation
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
        run: python3 scripts/ci/github_release.py resolve --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --acceptance-run "$ACCEPTANCE_RUN"
  build:
    needs: resolve
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      WEGIT_SKIP_PROJECT_GENERATION: '1'
      WEGIT_RELEASE_TAG: ${{ inputs.tag }}
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Verify tagged source and rebuild ordinary ad-hoc Release
        working-directory: source
        run: |
          scripts/ci/check-toolchain.sh
          scripts/verify.sh
          scripts/ci/prepare-git-246.sh
          env WEGIT_TEST_GIT="$(cat .build/git-246-path)" swift test
          scripts/ci/native-behavior.sh
          scripts/package-release.sh --adhoc
      - name: Validate and prepare versioned assets
        working-directory: source
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          CI_RUN: ${{ needs.resolve.outputs.ci_run }}
          ACCEPTANCE_RUN: ${{ needs.resolve.outputs.acceptance_run }}
        run: |
          packages=(.build/releases/package-*)
          test "${#packages[@]}" -eq 1
          python3 ../tooling/scripts/ci/github_release.py prepare \
            --repo "$GITHUB_REPOSITORY" --tag "$WEGIT_RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --ci-run "$CI_RUN" --acceptance-run "$ACCEPTANCE_RUN" \
            --directory "${packages[0]}" --output .build/release-upload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: source/.build/release-upload/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: .build/release-upload
      - name: Revalidate source and create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/ci/github_release.py publish --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --directory .build/release-upload
