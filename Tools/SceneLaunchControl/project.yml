name: SceneLaunchControl
options:
  minimumXcodeGenVersion: 2.43.0
  deploymentTarget:
    macOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
targetTemplates:
  AppKitApplication:
    type: application
    platform: macOS
    sources: [AppKitControl.swift]
  ControlApplication:
    type: application
    platform: macOS
    sources: [SceneControl.swift]
  ControlTests:
    type: bundle.ui-testing
    platform: macOS
    sources: [SceneControlUITests.swift]
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: SceneControlUITests.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ControlTests-Info.plist
  AsyncControlTests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AsyncSceneControlUITests.swift]
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: SceneControlUITests.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ControlTests-Info.plist
targets:
  AppKitBareApp:
    templates: [AppKitApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.appkit
  HostingBareApp:
    templates: [AppKitApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.hosting
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) HOSTED_SWIFTUI'
  AppKitLaunchTests:
    templates: [ControlTests]
    dependencies: [{target: AppKitBareApp}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.appkit.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.appkit
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/AppKitBareApp.app'
  HostingLaunchTests:
    templates: [ControlTests]
    dependencies: [{target: HostingBareApp}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.hosting.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.hosting
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/HostingBareApp.app'
  AsyncBareApp:
    templates: [ControlApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.async
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) BARE_WINDOW_GROUP'
  WorkspaceBareApp:
    templates: [ControlApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.workspace
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) BARE_WINDOW_GROUP'
  AsyncLaunchTests:
    templates: [AsyncControlTests]
    dependencies: [{target: AsyncBareApp}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.async.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.async
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/AsyncBareApp.app'
  WorkspaceLaunchTests:
    templates: [AsyncControlTests]
    dependencies: [{target: WorkspaceBareApp}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.workspace.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.workspace
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/WorkspaceBareApp.app'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WORKSPACE_LAUNCH'
  BareControl:
    templates: [ControlApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.bare
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) BARE_WINDOW_GROUP'
  SingleControl:
    templates: [ControlApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.single
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SINGLE_WINDOW'
  GroupControl:
    templates: [ControlApplication]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.group
  SingleControlTests:
    templates: [ControlTests]
    dependencies: [{target: SingleControl}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.single.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.single
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/SingleControl.app'
  GroupControlTests:
    templates: [ControlTests]
    dependencies: [{target: GroupControl}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.group.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.group
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/GroupControl.app'
  BareControlTests:
    templates: [ControlTests]
    dependencies: [{target: BareControl}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.bare.tests
        CONTROL_APP_BUNDLE_IDENTIFIER: com.willxue.wegit.scenecontrol.bare
        CONTROL_APP_PRODUCT_URL: '$(BUILT_PRODUCTS_DIR)/BareControl.app'
schemes:
  AppKitControl:
    build:
      targets:
        AppKitBareApp: all
        AppKitLaunchTests: [test]
    test:
      targets: [AppKitLaunchTests]
  HostingControl:
    build:
      targets:
        HostingBareApp: all
        HostingLaunchTests: [test]
    test:
      targets: [HostingLaunchTests]
  AsyncControl:
    build:
      targets:
        AsyncBareApp: all
        AsyncLaunchTests: [test]
    test:
      targets: [AsyncLaunchTests]
  WorkspaceControl:
    build:
      targets:
        WorkspaceBareApp: all
        WorkspaceLaunchTests: [test]
    test:
      targets: [WorkspaceLaunchTests]
  BareControl:
    build:
      targets:
        BareControl: all
        BareControlTests: [test]
    test:
      targets: [BareControlTests]
  SingleControl:
    build:
      targets:
        SingleControl: all
        SingleControlTests: [test]
    test:
      targets: [SingleControlTests]
  GroupControl:
    build:
      targets:
        GroupControl: all
        GroupControlTests: [test]
    test:
      targets: [GroupControlTests]
