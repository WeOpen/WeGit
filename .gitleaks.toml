# Default secret rules remain enabled. Exceptions match only reviewed source SHA-256 values.
[extend]
useDefault = true

# See docs/acceptance/2026-10-16/application-integration/secret-scan-review.json.
[[allowlists]]
description = "Reviewed source digests in JSON provenance receipts"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)docs/(?:acceptance|performance)/.+\.json$''']
regexTarget = "match"
regexes = [
